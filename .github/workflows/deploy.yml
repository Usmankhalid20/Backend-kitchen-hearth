name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME
          script: |
            # Log in to GHCR on the EC2 host
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Navigate to/create app deployment directory
            mkdir -p ~/kitchen-hearth
            cd ~/kitchen-hearth
            
            # Generate the production docker-compose.yml file dynamically
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              backend:
                image: ghcr.io/${{ env.IMAGE_NAME }}:latest
                container_name: kitchen-hearth-backend
                restart: always
                ports:
                  - "127.0.0.1:5000:5000"
                env_file:
                  - .env
                environment:
                  - NODE_ENV=production
                  - PORT=5000
            EOF
            
            # Pull latest backend image
            docker compose pull
            
            # Recreate container with the new image
            docker compose up -d
            
            # Remove unused Docker image versions to save disk space on EC2
            docker image prune -f
